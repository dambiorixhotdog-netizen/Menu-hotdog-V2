<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | D'Ambiorix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-amber-500/30 rounded-3xl max-w-sm w-full p-8 shadow-2xl relative">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-full bg-slate-950 border border-amber-500/40 mx-auto flex items-center justify-center mb-4 shadow-lg">
        <i class="fa-solid fa-lock text-amber-500 text-2xl"></i>
      </div>
      <h1 class="font-title text-2xl font-black text-white uppercase tracking-wide">Acceso Admin</h1>
    </div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-amber-500" placeholder="admin@dambiorix.com">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Contraseña</label>
        <input type="password" id="password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-amber-500" placeholder="••••••••">
      </div>
      <div id="errorMsg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-xs p-3 rounded-lg text-center"></div>
      <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-red-600 to-amber-500 hover:from-red-700 hover:to-amber-600 text-slate-950 font-black py-3 rounded-xl shadow-lg font-title uppercase tracking-wider text-sm mt-4">Iniciar Sesión</button>
    </form>
    <div class="text-center mt-6">
      <a href="index.html" class="text-xs text-slate-500 hover:text-amber-400"><i class="fa-solid fa-arrow-left mr-1"></i> Volver al menú</a>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
