<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | D'Ambiorix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">

  <!-- HEADER ADMIN -->
  <header class="bg-slate-900 border-b border-amber-500/20 shadow-lg p-4 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <h1 class="font-title text-xl font-black text-amber-400 uppercase">Panel de Control</h1>
      <div class="flex gap-3">
        <a href="index.html" target="_blank" class="text-sm font-semibold text-slate-300 hover:text-white bg-slate-800 px-4 py-2 rounded-xl">Ver Menú Público</a>
        <button id="logoutBtn" class="text-sm font-semibold text-red-400 hover:text-white bg-red-500/10 px-4 py-2 rounded-xl">Cerrar Sesión</button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO -->
  <main class="flex-grow max-w-6xl w-full mx-auto p-4 py-8 space-y-8">
    
    <!-- NAVEGACIÓN TABS -->
    <div class="flex gap-2 border-b border-slate-800 pb-4">
      <button onclick="showTab('products')" id="tab-products" class="px-4 py-2 rounded-xl font-bold bg-amber-500 text-slate-950">Productos</button>
      <button onclick="showTab('categories')" id="tab-categories" class="px-4 py-2 rounded-xl font-bold text-slate-400 hover:text-white">Categorías</button>
    </div>

    <!-- FORMULARIO DE PRODUCTO -->
    <section id="form-section" class="bg-slate-900 p-6 rounded-2xl border border-slate-800 hidden">
      <h2 class="font-title text-lg text-white font-bold mb-4" id="form-title">Nuevo Producto</h2>
      <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" id="prod-id">
        
        <div>
          <label class="text-xs text-slate-400 font-bold">Nombre</label>
          <input type="text" id="prod-name" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required>
        </div>
        
        <div>
          <label class="text-xs text-slate-400 font-bold">Precio Base (DOP)</label>
          <input type="number" id="prod-price" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required>
        </div>
        
        <div>
          <label class="text-xs text-slate-400 font-bold">Categoría</label>
          <!-- Se quitó el required para evitar el error de validación nativa -->
          <select id="prod-cat" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none">
            <option value="">Cargando categorías...</option>
          </select>
        </div>
        
        <div>
          <label class="text-xs text-slate-400 font-bold">Imagen</label>
          <input type="file" id="prod-img" accept="image/*" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-sm text-slate-300">
          <img id="img-preview" class="hidden w-16 h-16 object-cover rounded-md mt-2">
        </div>

        <div class="md:col-span-2">
          <label class="text-xs text-slate-400 font-bold">Descripción</label>
          <textarea id="prod-desc" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none"></textarea>
        </div>

        <!-- Variantes (Opcional) -->
        <div class="md:col-span-2 flex items-center gap-2">
          <input type="checkbox" id="prod-has-variants" class="w-4 h-4 accent-amber-500">
          <label class="text-sm text-slate-300">¿Tiene variantes (ej. Pequeña/Grande)?</label>
        </div>
        <div id="variants-section" class="md:col-span-2 grid grid-cols-2 gap-4 hidden">
          <div>
            <label class="text-xs text-slate-400">Precio Pequeña</label>
            <input type="number" id="prod-price-small" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
          </div>
          <div>
            <label class="text-xs text-slate-400">Precio Grande</label>
            <input type="number" id="prod-price-large" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
          </div>
        </div>

        <div class="md:col-span-2 flex gap-2 pt-4">
          <button type="submit" class="bg-amber-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl hover:bg-amber-400">Guardar</button>
          <button type="button" onclick="hideForm()" class="bg-slate-800 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-slate-700">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- TABLA DE PRODUCTOS -->
    <section id="section-products">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-title text-xl font-bold text-white">Productos</h2>
        <button onclick="showForm()" class="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-amber-400 text-sm"><i class="fa-solid fa-plus"></i> Nuevo Producto</button>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-800/50 text-slate-400">
            <tr>
              <th class="p-4">Imagen</th>
              <th class="p-4">Producto</th>
              <th class="p-4">Precio</th>
              <th class="p-4 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="productsTable" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>

    <!-- TABLA DE CATEGORÍAS -->
    <section id="section-categories" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-title text-xl font-bold text-white">Categorías</h2>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-800/50 text-slate-400">
            <tr>
              <th class="p-4">Nombre</th>
              <th class="p-4 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="categoriesTable" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- SCRIPTS -->
  <script type="module" src="js/admin.js"></script>
</body>
</html>
